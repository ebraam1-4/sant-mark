<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بيانات التلاميذ - مدرسة مار مرقس</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        min-height: 100vh;
        background: #031b24;
        color: #fff;
        padding: 2rem;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .header-box {
        background: rgba(255, 255, 255, 0.05);
        border: 0.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        gap: 10px;
        flex-wrap: wrap;
      }
      .welcome-txt {
        font-size: 18px;
        font-weight: bold;
      }
      .welcome-txt span {
        color: #d4af37;
      }
      .group-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.12);
        border: 0.5px solid rgba(212, 175, 55, 0.4);
        color: #d4af37;
        font-size: 13px;
        font-weight: bold;
      }
      .header-buttons {
        display: flex;
        gap: 12px;
      }
      .btn-logout,
      .btn-home {
        margin: 10px;
        padding: 10px 15px;
        background: #dc3545;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
      }

      .btn-logout a,
      .btn-home a {
        padding: 5px 15px;
        color: white;
        text-decoration: none;
      }

      /* أداة البحث */
      .filters-box {
        background: rgba(255, 255, 255, 0.05);
        border: 0.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .filters-box input {
        flex: 1;
        min-width: 160px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
        outline: none;
        font-family: sans-serif;
        direction: rtl;
      }
      .filters-box input::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }
      .filters-box input:focus {
        border-color: rgba(212, 175, 55, 0.75);
      }

      /* كارت المجموعة */
      .group-block {
        margin-bottom: 1.5rem;
      }
      .group-title {
        color: rgba(255, 255, 255, 0.652);
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 0.75rem;
        padding-bottom: 6px;
        border-bottom: 0.5px solid rgba(212, 175, 55, 0.25);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-title .count {
        color: rgba(255, 255, 255, 0.66);
        font-size: 15px;
        font-weight: normal;
      }

      .student-row {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 0.75rem;
        margin-bottom: 0.7rem;
        display: grid;
        grid-template-columns: minmax(180px, 1.5fr) repeat(
            4,
            minmax(105px, 1fr)
          );
        gap: 8px;
        align-items: stretch;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .student-row:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(212, 175, 55, 0.3);
      }

      .field-label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.652);
        margin: 0 0 5px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .student-row > div {
        min-width: 0;
        padding: 9px 10px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.12);
      }
      .field-value {
        min-height: 20px;
        overflow-wrap: anywhere;
        font-size: 13px;
        color: #d4af37;
      }
      .student-name .field-value {
        font-size: 15px;
        color: #d4af37;
      }
      .field-value.attendance {
        color: #34d399;
      }
      .field-value.absence {
        color: #ff5e5e;
      }

      .empty-msg {
        text-align: center;
        color: rgba(255, 255, 255, 0.4);
        padding: 2rem;
        font-size: 14px;
      }

      @media (max-width: 700px) {
        .student-row {
          grid-template-columns: 1fr 1fr;
        }
        .student-row > div:first-child {
          grid-column: 1 / -1;
        }
      }

      @media (min-width: 701px) and (max-width: 900px) {
        .student-row {
          grid-template-columns: 1.4fr repeat(4, minmax(90px, 1fr));
          padding: 0.6rem;
        }
        .student-row > div {
          padding-inline: 7px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-box">
        <div>
          <div class="welcome-txt">
            بيانات التلاميذ: أ/ <span id="teacherName">..</span>
          </div>
          <div class="group-badge">
            <i class="ti ti-users"></i> <span id="teacherGroupName">..</span>
          </div>
        </div>
        <div class="header-buttons">
          <button class="btn-home">
            <a href="index.html">الرئيسية</a>
          </button>
          <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
      </div>

      <div class="filters-box">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 دور باسم التلميذ..."
        />
      </div>

      <div id="studentsContainer">
        <div class="empty-msg">⏳ جاري تحميل بيانات التلاميذ...</div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="auth.js"></script>

    <script>
      const teacherName = sessionStorage.getItem("teacherName");
      const teacherGroup = sessionStorage.getItem("teacherGroup");

      const isTeacher =
        sessionStorage.getItem("isLoggedIn") === "true" &&
        sessionStorage.getItem("role") === "teacher";

      if (!isTeacher) {
        window.location.href = "login.html";
      } else if (!teacherGroup) {
        // خادم داخل بجلسة قديمة من غير مجموعة: نطلّعه ويسجل دخول من جديد ويختار مجموعته
        sessionStorage.clear();
        window.location.href = "login.html";
      } else {
        document.getElementById("teacherName").textContent = teacherName;
        document.getElementById("teacherGroupName").textContent = teacherGroup;
        loadGroupStudents();
      }

      // تلاميذ مجموعة الخادم بس
      let groupStudents = {};

      function escapeHtml(value) {
        return String(value === undefined || value === null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function loadGroupStudents() {
        const container = document.getElementById("studentsContainer");

        // بنقرا فرع مجموعة الخادم بس، مش كل المجموعات
        database
          .ref("groups/" + teacherGroup)
          .once("value")
          .then((snapshot) => {
            if (!snapshot.exists()) {
              container.innerHTML =
                '<div class="empty-msg">لا يوجد تلاميذ في مجموعة (' +
                escapeHtml(teacherGroup) +
                ") حالياً</div>";
              return;
            }
            groupStudents = snapshot.val() || {};
            renderStudents();
          })
          .catch((err) => {
            container.innerHTML =
              '<div class="empty-msg">خطأ في تحميل البيانات: ' +
              escapeHtml(err.message) +
              "</div>";
          });
      }

      function renderStudents() {
        const searchTerm = document.getElementById("searchInput").value.trim();
        const container = document.getElementById("studentsContainer");
        container.innerHTML = "";

        const allNames = Object.keys(groupStudents);
        const matchingNames = allNames.filter(
          (studentName) => !searchTerm || studentName.includes(searchTerm),
        );

        if (matchingNames.length === 0) {
          container.innerHTML =
            '<div class="empty-msg">' +
            (allNames.length === 0
              ? "لا يوجد تلاميذ في مجموعتك حالياً"
              : "لا يوجد تلاميذ مطابقين لبحثك") +
            "</div>";
          return;
        }

        const groupBlock = document.createElement("div");
        groupBlock.className = "group-block";

        const groupTitle = document.createElement("div");
        groupTitle.className = "group-title";
        groupTitle.innerHTML = `<i class="ti ti-users"></i> ${escapeHtml(teacherGroup)} <span class="count">(${matchingNames.length})</span>`;
        groupBlock.appendChild(groupTitle);

        matchingNames.forEach((studentName) => {
          const studentData = groupStudents[studentName] || {};
          const row = document.createElement("div");
          row.className = "student-row";
          row.innerHTML = `
                    <div class="student-name">
                        <div class="field-label"><i class="ti ti-user"></i> الاسم</div>
                        <div class="field-value">${escapeHtml(studentName)}</div>
                    </div>
                    <div>
                        <div class="field-label"><i class="ti ti-calendar-check"></i> الحضور</div>
                        <div class="field-value attendance">${escapeHtml(studentData.presence !== undefined ? studentData.presence : 0)}</div>
                    </div>
                    <div>
                        <div class="field-label"><i class="ti ti-calendar-x"></i> الغياب</div>
                        <div class="field-value absence">${escapeHtml(studentData.absence !== undefined ? studentData.absence : 0)}</div>
                    </div>
                    <div>
                        <div class="field-label"><i class="ti ti-phone"></i> رقم التليفون</div>
                      <div class="field-value">${escapeHtml(studentData.phone ?? "")}</div>
                    </div>
                    <div>
                        <div class="field-label"><i class="ti ti-cake"></i> عيد الميلاد</div>
                      <div class="field-value">${escapeHtml(studentData.birthday ?? "")}</div>
                    </div>
                `;

          groupBlock.appendChild(row);
        });

        container.appendChild(groupBlock);
      }

      document
        .getElementById("searchInput")
        .addEventListener("input", renderStudents);

      function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
